trigger:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

steps:
  - task: UseDotNet@2
    inputs:
      packageType: sdk
      version: 10.0.x
  - script: dotnet restore TradeFlow.slnx
    displayName: Restore
  - script: dotnet build TradeFlow.slnx -c Release --no-restore
    displayName: Build
  - task: DotNetCoreCLI@2
    displayName: Test
    inputs:
      command: test
      projects: TradeFlow.slnx
      arguments: -c Release --no-build
      publishTestResults: true
  - task: DotNetCoreCLI@2
    displayName: Publish API
    inputs:
      command: publish
      publishWebProjects: false
      projects: src/TradeFlow.Api/TradeFlow.Api.csproj
      arguments: -c Release -o $(Build.ArtifactStagingDirectory)/api
      zipAfterPublish: true
  - publish: $(Build.ArtifactStagingDirectory)/api
    artifact: api
