name: ci-cd
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore TradeFlow.slnx
      - run: dotnet build TradeFlow.slnx -c Release --no-restore
      - run: dotnet test TradeFlow.slnx -c Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
      - name: Publish API
        run: dotnet publish src/TradeFlow.Api/TradeFlow.Api.csproj -c Release -o api
      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: api

  deploy:
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api
          path: api
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: api
      - name: Smoke test
        run: |
          url="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/openapi/v1.json"
          for i in $(seq 1 12); do
            if curl -fsS "$url" -o /dev/null; then echo "API is up: $url"; exit 0; fi
            echo "Waiting for the API to start ($i)..."; sleep 10
          done
          echo "API did not respond"; exit 1
